<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일정 플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="planner">
    <header class="toolbar">
      <div class="tool-left">
        <button type="button" class="pill-btn" id="today-btn">오늘</button>
      </div>

      <div class="tool-center">
        <button type="button" class="nav-btn" id="prev-btn" aria-label="이전 달">‹</button>
        <h1 id="title" aria-live="polite"></h1>
        <button type="button" class="nav-btn" id="next-btn" aria-label="다음 달">›</button>
      </div>

      <div class="tool-right">
        <button type="button" class="pill-btn" id="login-btn" aria-label="구글 로그인" title="로그인하면 폰과 PC가 연동돼요" hidden>
          <span class="icon" aria-hidden="true">☁</span><span class="label">구글 로그인</span>
        </button>
        <button type="button" class="pill-btn" id="export-btn" aria-label="내보내기" title="내보내기">
          <span class="icon" aria-hidden="true">⤓</span><span class="label">내보내기</span>
        </button>
        <button type="button" class="pill-btn" id="import-btn" aria-label="불러오기" title="불러오기">
          <span class="icon" aria-hidden="true">⤒</span><span class="label">불러오기</span>
        </button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="calendar-wrap">
      <nav class="rail" id="rail" aria-label="월 바로가기"></nav>

      <section class="calendar glass" id="calendar">
        <div class="weekdays" aria-hidden="true">
          <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <aside class="todo glass" id="todo" aria-label="이번주 해야할 일">
        <div class="todo-head">
          <div class="todo-title">
            <h2>이번주 해야할 일</h2>
            <span class="todo-range" id="todo-range"></span>
          </div>
          <button type="button" class="todo-add-btn" id="todo-add" aria-label="할 일 추가" title="추가">+</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <div class="todo-folds" id="todo-folds"></div>
      </aside>
    </div>
  </main>

  <!-- 일정 입력창 (데스크톱: 가운데 창 / 모바일: 아래에서 올라오는 시트) -->
  <div class="overlay" id="overlay" hidden>
    <div class="panel glass" id="panel" role="dialog" aria-modal="true" aria-labelledby="form-title">
      <div class="sheet-head" id="sheet-head">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-title-row">
          <h2 id="day-title"></h2>
          <button type="button" class="close-btn" id="close-btn" aria-label="닫기">✕</button>
        </div>
      </div>

      <div class="day-list" id="day-list"></div>

      <form class="editor" id="editor" novalidate>
        <h3 id="form-title"></h3>
        <input type="text" id="title-input" maxlength="60" placeholder="일정 제목" autocomplete="off" aria-label="일정 제목">
        <textarea id="memo-input" rows="3" maxlength="500" placeholder="추가 내용 (선택)" aria-label="추가 내용"></textarea>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="메모 색상">
          <button type="button" class="swatch" role="radio" data-color="#FFFFFF" style="background:#FFFFFF" aria-label="흰색" title="흰색"></button>
          <button type="button" class="swatch" role="radio" data-color="#FFF4B8" style="background:#FFF4B8" aria-label="연한 노랑" title="연한 노랑"></button>
          <button type="button" class="swatch" role="radio" data-color="#DDF1FF" style="background:#DDF1FF" aria-label="연하늘색" title="연하늘색"></button>
          <button type="button" class="swatch" role="radio" data-color="#FFDADA" style="background:#FFDADA" aria-label="연한 빨강" title="연한 빨강"></button>
        </div>
        <div class="date-range">
          <label>
            <span>시작일</span>
            <input type="date" id="start-input" aria-label="시작일" required>
          </label>
          <span class="tilde" aria-hidden="true">~</span>
          <label>
            <span>마지막 일</span>
            <input type="date" id="end-input" aria-label="마지막 일" required>
          </label>
        </div>
        <div class="actions">
          <button type="button" class="btn danger" id="delete-btn" hidden>삭제</button>
          <button type="button" class="btn ghost" id="cancel-btn">취소</button>
          <button type="submit" class="btn primary" id="submit-btn">추가</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 불러오기 방식 선택 창 -->
  <div class="overlay" id="choice" hidden>
    <div class="panel dialog glass" role="alertdialog" aria-modal="true" aria-labelledby="choice-text">
      <p id="choice-text"></p>
      <p class="hint">합치기는 같은 일정을 중복 없이 더하고, 덮어쓰기는 지금 일정을 모두 지우고 바꿉니다.</p>
      <div class="actions wrap">
        <button type="button" class="btn ghost" id="choice-cancel">취소</button>
        <button type="button" class="btn danger-fill" id="choice-replace">덮어쓰기</button>
        <button type="button" class="btn primary" id="choice-merge">합치기</button>
      </div>
    </div>
  </div>

  <div class="trash" id="trash" hidden>🗑 여기로 끌어다 놓으면 삭제</div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="holidays.js"></script>
  <script src="script.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
